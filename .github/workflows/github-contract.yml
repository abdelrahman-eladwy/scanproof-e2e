# Real GitHub Actions scenarios for the GitHub connector, and ScanProof verifying its own run.
#
# Runs daily against ScanProof main, on fixtures/github/** branches, and manually. The scenario jobs reproduce what ScanProof
# must detect on GitHub; `self-verify` then runs `scanproof verify --provider github` against
# THIS run and checks the decision is the expected one.
name: github-contract

on:
  workflow_dispatch:
    inputs:
      scanproof_ref:
        description: ScanProof branch, tag or commit to test
        default: main
  pull_request:
    paths:
      - .github/workflows/github-contract.yml
      - policies/github/**
  schedule:
    - cron: "41 4 * * *"
  push:
    branches: ["fixtures/github/**"]

permissions:
  contents: read

jobs:
  semgrep-sast:
    name: semgrep-sast
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.181.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          mkdir -p reports
          semgrep scan --config p/default --metrics=off --json --output reports/semgrep.json targets/sample-app/
          semgrep scan --config p/default --metrics=off --sarif --output reports/semgrep.sarif targets/sample-app/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-report
          path: reports/

  # A scan step fails, but continue-on-error on the STEP keeps the job green.
  masked-step:
    runs-on: ubuntu-latest
    steps:
      - name: scanner crashes
        continue-on-error: true
        run: exit 1
      - run: echo "job still reports success"

  # The whole JOB fails, but continue-on-error on the JOB keeps the workflow green.
  masked-job:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - run: exit 1

  skipped-scan:
    if: ${{ github.event_name == 'never-happens' }}   # always skipped
    runs-on: ubuntu-latest
    steps:
      - run: echo never

  # A passing exact `sast` job must not hide this failing `sast (py)` matrix leg.
  exact-sast:
    name: sast
    runs-on: ubuntu-latest
    steps:
      - run: echo "the exact-name job passes"

  matrix-sast:
    name: sast (${{ matrix.lang }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lang: [py, go]
    steps:
      - name: scan
        continue-on-error: ${{ matrix.lang == 'py' }}
        run: |
          if [ "${{ matrix.lang }}" = "py" ]; then exit 1; fi
          echo ok

  # #60: `js` was removed from this matrix (it was [py, js]). Only the `py` leg runs, and it
  # passes, so nothing in the job names shows a leg is gone. A real Semgrep report lets the
  # production-profile policies run with every check on.
  removed-leg:
    name: leg-sast (${{ matrix.lang }})
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.181.1
    strategy:
      matrix:
        lang: [py]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          mkdir -p reports
          semgrep scan --config p/default --metrics=off --json --output reports/semgrep.json targets/sample-app/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: leg-report
          path: reports/

  # 150 warning annotations first, so the masked failure lands on annotation page 2.
  noisy-masked:
    runs-on: ubuntu-latest
    steps:
      - run: for i in $(seq 1 150); do echo "::warning title=lint::finding $i"; done
      - name: scanner crashes
        continue-on-error: true
        run: exit 1

  reusable-call:
    uses: ./.github/workflows/reusable-scan.yml

  scope-free:
    runs-on: ubuntu-latest
    steps:
      - name: Produce syntactically valid but scope-free Semgrep-shaped report
        run: |
          mkdir -p reports
          printf '%s\n' '{"results":[],"errors":[]}' > reports/semgrep.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scope-free-report
          path: reports/semgrep.json

  self-verify:
    needs: [semgrep-sast, exact-sast, masked-step, masked-job, skipped-scan, matrix-sast, removed-leg, noisy-masked, reusable-call, scope-free]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read     # annotations reveal steps hidden by continue-on-error
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/install-scanproof
        with:
          ref: ${{ inputs.scanproof_ref || 'main' }}
      - name: ScanProof verifies this run (first attempt)
        if: ${{ github.run_attempt == 1 }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          check() {  # check <policy> <expected exit>
            scanproof verify --provider github -P "$1" --pipeline "${{ github.run_id }}" \
              -p "${{ github.repository }}" -o "out-$(basename "$1" .yaml).json"
            rc=$?
            echo "::notice title=self-verify $(basename "$1")::exit $rc (expected $2)"
            [ "$rc" = "$2" ] || failed=1
          }
          failed=0
          check policies/github/sast.yaml 0
          check policies/github/masked-step.yaml 1
          check policies/github/masked-job.yaml 1
          check policies/github/skipped.yaml 1
          check policies/github/matrix.yaml 1
          check policies/github/noisy.yaml 1
          check policies/github/reusable.yaml 0

          # Opt-in reported_scope assurance against real and scope-free reports.
          check policies/github/scoped-ok.yaml 0
          check policies/github/scoped-missing.yaml 2
          exit $failed
      # Re-running only the gate can expose synthetic new-attempt job IDs for scans that
      # actually ran on an older attempt. Their masking annotations may no longer be
      # accessible; ScanProof must return UNKNOWN or FAIL, never a false VERIFIED (#90).
      - name: Gate-only rerun cannot verify inherited masked scans (scanproof#90)
        if: ${{ github.run_attempt > 1 }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          failed=0
          for policy in masked-step matrix noisy; do
            out="rerun-$policy.json"
            scanproof verify --provider github -P "policies/github/$policy.yaml" \
              --pipeline "${{ github.run_id }}" -p "${{ github.repository }}" -o "$out"
            rc=$?
            got=$(python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); print(",".join(sorted({c["code"] for q in r["requirements"] for c in q["checks"] if c["outcome"] not in ("PASS","NOT_APPLICABLE")})))' "$out")
            echo "::notice title=gate-only rerun $policy::exit $rc (must be nonzero); codes [$got]"
            if [ "$rc" != 1 ] && [ "$rc" != 2 ]; then failed=1; fi
            case "$got" in
              *STEP_MASKING_UNKNOWN*|*FAILURE_MASKED_BY_ALLOW_FAILURE*) ;;
              *) failed=1 ;;
            esac
          done
          exit $failed
      # Its own step: GitHub keeps only 10 annotations per step, and each result below is one.
      - name: ScanProof detects a removed matrix leg (scanproof#60)
        if: ${{ always() && github.run_attempt == 1 }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          failed=0
          check() {  # check <policy> <expected exit> <expected non-passing 'check=CODE' pairs, sorted, comma-joined>
            out="out-$(basename "$1" .yaml).json"
            scanproof verify --provider github -P "$1" --pipeline "${{ github.run_id }}" \
              -p "${{ github.repository }}" -o "$out"
            rc=$?
            got=$(python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); print(",".join(sorted(c["check"]+"="+c["code"] for q in r["requirements"] for c in q["checks"] if c["outcome"] not in ("PASS","NOT_APPLICABLE"))))' "$out")
            echo "::notice title=#60 $(basename "$1")::exit $rc (expected $2); codes [$got] (expected [$3])"
            [ "$rc" = "$2" ] && [ "$got" = "$3" ] || failed=1
          }
          # Declared legs fail; undeclared keeps the old outcome (compatible) or is UNKNOWN (production).
          check policies/github/removed-leg-declared.yaml 1 "job_present [leg-sast (js)]=REQUIRED_INSTANCE_ABSENT"
          check policies/github/removed-leg-undeclared.yaml 0 ""
          check policies/github/removed-leg-production.yaml 2 "instances_declared=INSTANCES_UNDECLARED"
          check policies/github/removed-leg-production-ok.yaml 0 ""
          exit $failed
