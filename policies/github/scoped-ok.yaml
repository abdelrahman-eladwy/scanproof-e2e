# Opt-in reported_scope assurance on a real Semgrep report. Expected: VERIFIED (exit 0).
apiVersion: scanproof.dev/v1alpha1
kind: PipelineAssurancePolicy
metadata: {name: github-scoped-ok}
project: {provider: github, id: abdelrahman-eladwy/scanproof-e2e}
assurance: {minimum_level: reported_scope}
requirements:
  - id: SAST
    tool: semgrep
    job_name: sast
    artifact_name: semgrep-report
    report_path: semgrep.json
    checks: {scanner_errors_allowed: 0}
enforcement: {on_unknown: block, on_nothing_applicable: block}
