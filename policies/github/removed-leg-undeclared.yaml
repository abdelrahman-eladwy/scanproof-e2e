# ScanProof verifying its own GitHub Actions run (github-contract.yml), issue #60.
# Expected: VERIFIED (exit 0): without `instances` a removed leg is not detected (unchanged compatible behavior)
apiVersion: scanproof.dev/v1alpha1
kind: PipelineAssurancePolicy
metadata: {name: github-removed-leg-undeclared}
project: {provider: github, id: abdelrahman-eladwy/scanproof-e2e}
requirements:
  - id: SAST
    tool: semgrep
    job_name: leg-sast
    artifact_name: leg-report
    report_path: semgrep.json
