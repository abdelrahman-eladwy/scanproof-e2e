# ScanProof verifying its own GitHub Actions run (github-contract.yml).
# Expected: BLOCKED (exit 1): the passing exact `sast` job does not hide the failing `sast (py)` instance
apiVersion: scanproof.dev/v1alpha1
kind: PipelineAssurancePolicy
metadata: {name: github-matrix}
project: {provider: github, id: abdelrahman-eladwy/scanproof-e2e}
requirements:
  - id: SCAN
    tool: semgrep
    job_name: sast
    artifact_name: none
    report_path: none.json
    checks:
      report_required: false   # this scenario is about the job result, not a report
